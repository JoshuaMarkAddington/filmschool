name: Deploy and set secrets

# Manually triggered. Deploys the Worker from this repo and attaches all
# secret values, driven by GitHub repository secrets — bypassing the
# Cloudflare dashboard and the Git-integration build entirely.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ZAPIER_SMS_EMAIL: ${{ secrets.ZAPIER_SMS_EMAIL }}
        run: |
          set -e
          for name in ADMIN_PASSWORD ADMIN_SESSION_SECRET ADMIN_NOTIFY_EMAIL RESEND_API_KEY RESEND_FROM STRIPE_WEBHOOK_SECRET ZAPIER_SMS_EMAIL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Skipping $name (no GitHub secret set for it)"
              continue
            fi
            echo "Setting $name on Worker filmschool..."
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name" --name filmschool
          done
