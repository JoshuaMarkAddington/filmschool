name: Set Cloudflare Secrets

# Manually triggered. Run this from the Actions tab any time a secret value
# changes — it pushes the values below straight into the live Worker via
# `wrangler secret put`, bypassing the Cloudflare dashboard entirely.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -e
          for name in ADMIN_PASSWORD ADMIN_SESSION_SECRET ADMIN_NOTIFY_EMAIL RESEND_API_KEY RESEND_FROM STRIPE_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Skipping $name (no GitHub secret set for it)"
              continue
            fi
            echo "Setting $name on Worker filmschool..."
            printf '%s' "$value" | npx wrangler secret put "$name" --name filmschool
          done
