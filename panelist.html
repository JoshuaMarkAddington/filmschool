<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audition Panel — Adders Film School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #070B14;
      --bg2:       #0E1525;
      --text:      #F4F1EA;
      --muted:     #8A93A8;
      --line:      #1B2440;
      --copper:    #E0894A;
      --gold:      #E8B84B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(224,137,74,.10), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 24px 90px; }

    .back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 14px;
      transition: color .15s ease, border-color .15s ease;
    }
    .back:hover { color: var(--copper); border-color: rgba(224,137,74,.5); }

    /* ---------- profile ---------- */
    .profile {
      display: grid;
      grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
      gap: 44px;
      align-items: start;
      margin-top: 40px;
      animation: rise .45s cubic-bezier(.25,.46,.45,.94) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    .shot {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg2);
      box-shadow: 0 26px 60px rgba(0,0,0,.5);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .panel-kicker {
      color: var(--copper);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 10px;
    }
    .panel-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
    }
    .panel-role {
      color: var(--gold);
      font-size: 15px;
      font-weight: 600;
      margin: 12px 0 0;
    }
    .rule {
      height: 2px;
      width: 74px;
      margin: 26px 0;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--copper), rgba(224,137,74,0));
    }
    .bio p {
      color: #CFD5E2;
      font-size: 16px;
      line-height: 1.8;
      margin: 0 0 18px;
    }

    .footer-links {
      margin-top: 46px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .cta {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 12px;
      color: #070B14;
      background: linear-gradient(180deg, var(--copper), #B5651D);
      transition: transform .12s ease;
    }
    .cta:hover { transform: translateY(-2px); }
    .ghost {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 22px;
      border-radius: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      transition: color .15s ease, border-color .15s ease;
    }
    .ghost:hover { color: var(--text); border-color: rgba(224,137,74,.5); }

    .missing { margin-top: 60px; text-align: center; }
    .missing h1 { font-family: 'Cinzel', serif; font-size: 28px; margin: 0 0 12px; }
    .missing p { color: var(--muted); line-height: 1.7; }

    @media (max-width: 780px) {
      .profile { grid-template-columns: 1fr; gap: 30px; }
      .shot { max-width: 340px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="audition.html#panel">‹ Back to the panel</a>
    <div id="profile"></div>
  </div>

  <script src="panel.js"></script>
  <script>
    (function () {
      var list = window.PANELISTS || [];
      var id = new URLSearchParams(window.location.search).get("id");
      var person = list.filter(function (p) { return p.id === id; })[0];
      var mount = document.getElementById("profile");

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      if (!person) {
        document.title = "Audition Panel — Adders Film School";
        mount.innerHTML =
          '<div class="missing">' +
            "<h1>We couldn't find that panelist</h1>" +
            "<p>The link may be out of date. Head back to the audition page to see who's on the panel.</p>" +
            '<p style="margin-top:26px"><a class="cta" href="audition.html#panel">Meet the panel</a></p>' +
          "</div>";
        return;
      }

      document.title = person.name + " — Audition Panel | Adders Film School";

      mount.innerHTML =
        '<div class="profile">' +
          '<div class="shot">' +
            '<img src="' + esc(person.photo) + '" alt="' + esc(person.name) + '"' +
              ' style="object-position:' + esc(person.focus || "center 20%") + '">' +
          "</div>" +
          "<div>" +
            '<p class="panel-kicker">Audition Panel</p>' +
            '<h1 class="panel-name">' + esc(person.name) + "</h1>" +
            (person.role ? '<p class="panel-role">' + esc(person.role) + "</p>" : "") +
            '<div class="rule"></div>' +
            '<div class="bio">' +
              person.bio.map(function (para) { return "<p>" + esc(para) + "</p>"; }).join("") +
            "</div>" +
            '<div class="footer-links">' +
              '<a class="cta" href="audition.html">Sign up for an audition</a>' +
              '<a class="ghost" href="audition.html#panel">See the rest of the panel</a>' +
            "</div>" +
          "</div>" +
        "</div>";
    })();
  </script>
</body>
</html>
