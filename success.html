<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're in! — Adders Film School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse 80% 40% at 50% -5%, #E0894A1A, transparent 55%), #070B14;
      color: #F4F1EA; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; padding: 32px;
    }
    .card { max-width: 460px; text-align: center; }
    .mark { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 18px; display: block; }
    h1 { font-family: 'Cinzel', serif; font-size: 28px; margin: 0; line-height: 1.2; }
    p { color: #8A93A8; font-size: 15px; line-height: 1.75; margin-top: 14px; }
    .note {
      background: #0E1E12; border: 1px solid #1E4A28; border-radius: 13px;
      padding: 16px 18px; margin-top: 22px; text-align: left; color: #5BC08A;
      font-weight: 700; font-size: 14px;
    }
    .note span { display: block; color: #8A93A8; font-weight: 400; font-size: 12.5px; margin-top: 4px; }
    a.home {
      display: inline-block; margin-top: 26px; color: #E0894A; text-decoration: none;
      font-weight: 600; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="Adders Film School Logo 110825.png" alt="Adders Film School">
    <h1>You're in! 🎬</h1>
    <p>Thanks for completing your application and payment. Welcome to Adders Film School.</p>
    <div class="note">
      Payment received
      <span>Our team will be in touch by email shortly to confirm your membership details and module schedule.</span>
    </div>
    <a class="home" href="index.html">‹ Back to the website</a>
  </div>
</body>
</html>
